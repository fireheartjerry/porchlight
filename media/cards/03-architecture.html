<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Porchlight — architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..800,0..100,0..1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>
  <!--
    docs/architecture.png, pinned to the porch like a printed page. The diagram
    is 8:5 and carries its own title, so the card adds nothing but the paper, the
    shadow and the night around it — and it stops at y=908, clear of the band
    media/assemble.py burns the captions into. media/narration.json gives this
    shot a stronger Ken Burns push than the others so the AgentCore half of the
    drawing is legible by the time the narrator gets to it.
  -->
  <div class="stage" style="padding:0">
    <div style="position:absolute;left:50%;top:14px;transform:translateX(-50%);
                background:#fdfcfa;border-radius:20px;padding:16px;
                box-shadow:0 44px 100px -34px rgba(0,0,0,0.88), 0 0 0 1px rgba(255,179,71,0.22)">
      <img src="../../docs/architecture.png" alt="" style="display:block;height:848px;width:auto">
    </div>
  </div>
</body>
