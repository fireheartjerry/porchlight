<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Porchlight — Good Neighbor Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..800,0..100,0..1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
</head>
<body>
  <div class="stage" style="gap:40px">
    <p class="eyebrow">AWS Hackathon &nbsp;·&nbsp; Agents for Humans</p>
    <h1 class="headline" style="font-size:108px">Good Neighbor Agents</h1>
    <hr class="rule" style="width:760px">
    <p class="body" style="font-size:36px;max-width:30ch;color:var(--cream)">
      Built for the one volunteer coordinator who runs a whole neighbourhood from her phone —
      and answers every request herself, after work, for free.
    </p>
    <div class="chips" style="margin-top:14px">
      <span class="chip lamp">Strands Agents</span>
      <span class="chip">Amazon Bedrock AgentCore</span>
      <span class="chip">Claude Sonnet + Haiku</span>
      <span class="chip">AgentCore Memory</span>
    </div>
    <div style="position:absolute;right:160px;bottom:180px" data-lantern="230"></div>
  </div>
  <script src="lantern.js"></script>
</body>
</html>
