[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "porchlight"
version = "0.1.0"
description = "Autonomous dispatcher for small volunteer groups. Runs the coordination; lights up only when you're needed."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Porchlight" }]
dependencies = [
    "strands-agents",
    "strands-agents-tools",
    "bedrock-agentcore",
    "boto3",
    "pydantic>=2",
    "pydantic-settings",
    "fastapi",
    "uvicorn",
    "mangum",
    "sse-starlette",
    "mcp",
    "httpx",
    "python-dateutil",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
porchlight-seed = "scripts.seed:main"

[tool.setuptools.packages.find]
include = ["porchlight*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["*_test_*.py", "test_*.py", "*_test.py"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "web", "infra", "cdk.out", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
